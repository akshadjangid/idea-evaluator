<script type="module">
const CFG = window.APP_CONFIG || {};
const hasCognito = Boolean(CFG.userPoolId && CFG.userPoolClientId);
let auth = {};
const authReady = (async () => {
  if (!hasCognito) return;

  const amplifyModule = await import(
    "https://esm.sh/aws-amplify@6.22.2"
  );

  auth = await import(
    "https://esm.sh/aws-amplify@6.22.2/auth"
  );

  amplifyModule.Amplify.configure({
    Auth: {
      Cognito: {
        userPoolId: CFG.userPoolId,
        userPoolClientId: CFG.userPoolClientId,
        loginWith: { email: true }
      }
    }
  });
})();
const tokensToSession = async () => {
  await authReady;
  const session = await auth.fetchAuthSession();
  const id = session.tokens?.idToken?.toString(), access = session.tokens?.accessToken?.toString();
  if (!id) throw new Error("Cognito did not return an ID token. Please sign in again.");
  sessionStorage.setItem("cognito_id_token", id);
  if (access) sessionStorage.setItem("cognito_access_token", access);
  const claims = JSON.parse(atob(id.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
  return {email:String(claims.email||"").toLowerCase(),name:String(claims.name||claims.preferred_username||claims.email||"Student"),role:(claims["cognito:groups"]||[]).includes("faculty")?"faculty":"student",sub:String(claims.sub||"")};
};
const localUsers = () => { try { return JSON.parse(localStorage.getItem("local_demo_users")||"{}"); } catch (_) { return {}; } };
window.CognitoForm = {
  signIn: async (email,password) => {
    if (!hasCognito) {
      if (!email || !password) throw new Error("Enter your email address and password.");
      const record=localUsers()[email.toLowerCase()];
      if (!record) throw new Error("No local demo account exists in this browser. Create an account first.");
      if (record.confirmed === false) throw new Error("Verify your email first (local demo: use the code 000000).");
      const u={email:email.toLowerCase(),name:record.name||email.split("@")[0],role:"student",sub:"local:"+email.toLowerCase(),localDemo:true};
      sessionStorage.setItem("local_demo_user",JSON.stringify(u)); return u;
    }
    await authReady; await auth.signIn({username:email,password,options:{authFlowType:"USER_SRP_AUTH"}}); return tokensToSession();
  },
  signUp: async (email,password,name) => {
    if (!hasCognito) {
      if (!email || !password || password.length<8) throw new Error("Use a valid email and a password with at least 8 characters.");
      const users=localUsers(), key=email.toLowerCase();
      if (users[key]) throw new Error("An account with this email already exists in this browser.");
      users[key]={name:name||key.split("@")[0],confirmed:false}; localStorage.setItem("local_demo_users",JSON.stringify(users));
      return {nextStep:{signUpStep:"CONFIRM_SIGN_UP"}};
    }
    await authReady; return auth.signUp({username:email,password,options:{userAttributes:name?{email,name}:{email}}});
  },
  confirmSignUp: async (email,code) => {
    if (!hasCognito) {
      if (code !== "000000") throw new Error("For local demo mode, enter 000000 as the verification code.");
      const users=localUsers(), key=email.toLowerCase(); if(!users[key])throw new Error("No local demo account found.");
      users[key].confirmed=true; localStorage.setItem("local_demo_users",JSON.stringify(users)); return {};
    }
    await authReady; return auth.confirmSignUp({username:email,confirmationCode:code});
  },
  resetPassword: async (email) => { if(!hasCognito){const users=localUsers();if(!users[email.toLowerCase()])throw new Error("No local demo account found in this browser.");return {nextStep:{resetPasswordStep:"CONFIRM_RESET_PASSWORD_WITH_CODE"}};} await authReady; return auth.resetPassword({username:email}); },
  confirmResetPassword: async (email,code,newPassword) => { if(!hasCognito){if(code!=="000000"||newPassword.length<8)throw new Error("Use code 000000 and a password of at least 8 characters in local demo mode.");return {};} await authReady; return auth.confirmResetPassword({username:email,confirmationCode:code,newPassword}); },
  signOut: async () => { if(hasCognito){await authReady;try{await auth.signOut()}finally{clearCognitoSession();}}else{sessionStorage.removeItem("local_demo_user");} }
};
window.cognitoAuthReady = authReady;
window.refreshCognitoSession = tokensToSession;
</script>
<script>
const hasCognito = Boolean(window.APP_CONFIG && window.APP_CONFIG.userPoolId && window.APP_CONFIG.userPoolClientId);
function decodeJwtPayload(token) {
  const part=token.split(".")[1]; if(!part)throw new Error("Invalid token received from Cognito.");
  const normalized=part.replace(/-/g,"+").replace(/_/g,"/");
  return JSON.parse(decodeURIComponent(Array.from(atob(normalized.padEnd(Math.ceil(normalized.length/4)*4,"="))).map(c=>"%"+c.charCodeAt(0).toString(16).padStart(2,"0")).join("")));
}
const withCls=u=>{if(u){try{u.cls=localStorage.getItem("cls_"+u.email)||""}catch(e){u.cls=""}}return u};
function restoreCognitoUser() {
  try { const local=sessionStorage.getItem("local_demo_user"); if(local)return withCls(JSON.parse(local)); } catch (_) {}
  const token=sessionStorage.getItem("cognito_id_token"); if(!token)return null;
  try { const claims=decodeJwtPayload(token); if(!claims.exp||claims.exp*1000<=Date.now()){clearCognitoSession();return null;}
    const groups=Array.isArray(claims["cognito:groups"])?claims["cognito:groups"]:[];
    return withCls({email:String(claims.email||"").toLowerCase(),name:String(claims.name||claims.preferred_username||claims.email||"Student"),role:groups.includes("faculty")?"faculty":"student",sub:String(claims.sub||"")});
  } catch(e){clearCognitoSession();return null;}
}
function clearCognitoSession(){["cognito_id_token","cognito_access_token","cognito_refresh_token"].forEach(k=>sessionStorage.removeItem(k));}
async function handleCognitoCallback() { /* Amplify manages the configured Cognito auth flow. */ }
try{const t=localStorage.getItem("theme1");if(t)document.documentElement.dataset.theme=t}catch(e){}
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
function wireTheme(){document.querySelectorAll("[data-theme-btn]").forEach(b=>{
  b.innerHTML='<span aria-hidden="true">&#9680;</span><span class="tl"> '+(isDark()?"Light mode":"Dark mode")+'</span>';
  b.onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("theme1",t)}catch(e){}wireTheme()};
})}
const W={innovation:20,feasibility:20,cost:15,time:15,impact:20,scalability:10};
const DEF={...W};
try{const sw=JSON.parse(localStorage.getItem("weights1")||"null");if(sw&&Object.keys(DEF).every(k=>Number.isInteger(sw[k]))&&Object.values(sw).reduce((a,b)=>a+b,0)===100)Object.assign(W,sw)}catch(e){}
const sumW=()=>Object.values(W).reduce((a,b)=>a+b,0);
const L={innovation:"Innovation",feasibility:"Feasibility",cost:"Cost",time:"Dev time",impact:"Impact",scalability:"Scalability"};
const TIPS={innovation:"This overlaps an existing idea. Add a feature or user group nobody has covered.",feasibility:"Reduce technical scope, or pick tools your team already knows.",cost:"Replace paid APIs with free-tier options. Aim for under Rs 2,000.",time:"Cut scope to fit a 14 week term and set a milestone every 2 weeks.",impact:"Name one specific user group, tag the SDG your idea supports, and add a one line reason.",scalability:"Move storage and compute to managed cloud services."};
const SDG=["No Poverty","Zero Hunger","Good Health and Well-being","Quality Education","Gender Equality","Clean Water and Sanitation","Affordable and Clean Energy","Decent Work and Economic Growth","Industry, Innovation and Infrastructure","Reduced Inequalities","Sustainable Cities and Communities","Responsible Consumption and Production","Climate Action","Life Below Water","Life on Land","Peace, Justice and Strong Institutions","Partnerships for the Goals"];
const clamp=n=>Math.max(0,Math.min(10,n));
const words=t=>new Set(t.toLowerCase().match(/[a-z]{4,}/g)||[]);
function sim(a,b){const x=words(a),y=words(b);if(!x.size||!y.size)return 0;let i=0;x.forEach(w=>y.has(w)&&i++);return i/(x.size+y.size-i)}
const CLOUD=["aws","amazon","lambda","s3","dynamodb","cognito","amplify","ec2","ecs","eks","cloudfront","api gateway","apigateway","sns","sqs","bedrock","sagemaker","rds","aurora","azure","gcp","google cloud","firebase","firestore","heroku","vercel","netlify","cloudflare","digitalocean","atlas","supabase","serverless","cloud"];
const LOCAL=["offline","desktop","arduino","raspberry","esp32","sqlite","xampp","local server","local database","localhost","on-premise","on premise"];
const hits=(t,L)=>L.filter(k=>new RegExp("(^|[^a-z0-9])"+k+"([^a-z0-9]|$)").test(t.toLowerCase()));
const archOf=t=>{const c=hits(t,CLOUD).length,l=hits(t,LOCAL).length;return c&&l?"hybrid":c?"cloud":"local"};
function autoInn(d){const m=Math.max(0,...ideas.filter(x=>x.id!==d.id).map(o=>sim(d.title+" "+d.desc,o.title+" "+o.desc)));return clamp(10-m*14)*10}
function score(d,others){
  const m=Math.max(0,...others.map(o=>sim(d.title+" "+d.desc,o.title+" "+o.desc)));
  const s={innovation:d.ovr!=null?clamp(d.ovr/10):clamp(10-m*14),feasibility:clamp(10-(d.complexity-1)*2.5+(d.skill-2)*1.5),
    cost:d.budget<=500?10:d.budget<=2000?8:d.budget<=5000?6:d.budget<=10000?4:2,
    time:d.weeks<=10?10:d.weeks<=14?8:d.weeks<=18?5:2,impact:clamp(d.impact*2+(d.sdg&&(d.why||"").trim().length>=20?1.5:0)),scalability:{cloud:10,hybrid:6,local:2}[d.arch]};
  let t=0;for(const k in W)t+=s[k]*W[k]/10;
  return{s,total:Math.round(t)};
}
const verdict=t=>t>=85?["Highly Suitable","ok"]:t>=70?["Suitable","ok"]:t>=55?["Needs Improvement","warn"]:["Not Recommended","bad"];
const diff=s=>s.feasibility>=8?"Low":s.feasibility>=5?"Medium":"High";
const strengths=s=>{const t=Object.keys(W).filter(k=>s[k]>=8).map(k=>`<li>${L[k]}</li>`).join("");return t?`<ul>${t}</ul>`:"<p>No standout strengths yet.</p>"};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let sample=null,ideas=[],role="student",sel=null,last=null,user=restoreCognitoUser(),users=[],mode="in",page="dash",q="",flt="",wmsg="",lsdg="",fmsg="",fcls="",delArm="";
try{ideas=JSON.parse(localStorage.getItem("ideas4")||"[]")}catch(e){}
ideas=(Array.isArray(ideas)?ideas:[]).filter(d=>d&&typeof d.title==="string"&&d.s&&typeof d.total==="number");
const save=()=>{try{localStorage.setItem("ideas4",JSON.stringify(ideas))}catch(e){}};
// Used only as a display label for preloaded demo content, never as a login credential.
const FAC={email:"faculty-demo@invalid.local",name:"Demo Faculty",role:"faculty"};
const saveU=()=>{try{localStorage.setItem("cls_"+user.email,user.cls||"")}catch(e){}};
const view=()=>role==="faculty"?ideas:ideas.filter(d=>d.owner===user.email||(d.team||[]).includes(user.email));
let fps=[];

function authMessage(msg){const el=document.getElementById("auth-error");if(el)el.textContent=msg||"";}
function wireAuth(){
  const form=document.getElementById("auth-form"),submit=document.getElementById("auth-submit");
  if(form)form.addEventListener("submit",async e=>{
    e.preventDefault(); if(!submit)return; submit.disabled=true; const old=submit.textContent;submit.textContent="Please wait…";authMessage("");
    try{
      if(authMode==="login"){
        const email=document.getElementById("auth-email").value.trim(),password=document.getElementById("auth-password").value;
        if(!email||!password)throw new Error("Enter your email address and password.");
        user=withCls(await window.CognitoForm.signIn(email,password));if(window.AppCloud)await window.AppCloud.activate(user);page="dash";history.replaceState({},document.title,location.pathname);render();return;
      }
      if(authMode==="signup"){
        const email=document.getElementById("auth-email").value.trim(),password=document.getElementById("auth-password").value,name=document.getElementById("auth-name").value.trim().slice(0,60);
        if(!name)throw new Error("Enter your full name.");
        if(!email||!password)throw new Error("Enter your email address and password.");
        if(password.length<8)throw new Error("Use a password with at least 8 characters.");
        const result=await window.CognitoForm.signUp(email,password,name);authPendingEmail=email;
        authMode=result.nextStep?.signUpStep==="CONFIRM_SIGN_UP"?"confirm":"login";
        render(); if(authMode==="login")authMessage("Account created. You can now sign in."); return;
      }
      if(authMode==="confirm"){
        const code=document.getElementById("auth-code").value.trim();if(!code)throw new Error("Enter the verification code from your email.");
        await window.CognitoForm.confirmSignUp(authPendingEmail,code);authMode="login";render();authMessage("Email verified. Sign in to continue.");return;
      }
      if(authMode==="forgot"){
        authPendingEmail=document.getElementById("auth-email").value.trim();if(!authPendingEmail)throw new Error("Enter your email address.");
        const result=await window.CognitoForm.resetPassword(authPendingEmail);
        authMode=result.nextStep?.resetPasswordStep==="CONFIRM_RESET_PASSWORD_WITH_CODE"?"reset":"login";render();if(authMode==="reset")authMessage("If the account can be recovered, a reset code has been sent.");return;
      }
      if(authMode==="reset"){
        const code=document.getElementById("auth-code").value.trim(),password=document.getElementById("auth-password").value;
        if(!code||!password)throw new Error("Enter the reset code and your new password.");
        await window.CognitoForm.confirmResetPassword(authPendingEmail,code,password);authMode="login";render();authMessage("Password updated. Sign in with your new password.");return;
      }
    }catch(err){authMessage(err?.message||"Authentication failed. Please try again.");}
    finally{if(document.body.contains(submit)){submit.disabled=false;submit.textContent=old;}}
  });
  const email=document.getElementById("auth-email");
  if(authMode==="login"&&email)document.getElementById("auth-forgot").onclick=()=>{authPendingEmail=email.value.trim();authMode="forgot";render()};
  if(authMode==="login")document.getElementById("auth-create").onclick=()=>{authMode="signup";render()};
  const facultyDemo=document.getElementById("faculty-demo-login");
  if(facultyDemo)facultyDemo.onclick=()=>{
    // This shortcut exists only when Cognito is not configured. It is for local UI preview,
    // not an authenticated or authorized faculty identity for a deployed environment.
    user=withCls({email:FAC.email,name:FAC.name,role:"faculty",sub:"local:faculty-demo",localDemo:true});
    sessionStorage.setItem("local_demo_user",JSON.stringify(user));
    page="dash";history.replaceState({},document.title,location.pathname);render();
  };
  const back=document.getElementById("auth-back");if(back)back.onclick=()=>{authMode="login";render()};
}

    fps.push({id:"p"+Date.now(),title:v("fpt").slice(0,120),desc:v("fpd").slice(0,1000),skills:v("fps").slice(0,200),slots:+v("fpn"),deadline:dl,owner:user.email,status:"Open",requests:[],gh:"",demo:"",note:"",pub:true});saveF();render();
  };
  document.querySelectorAll("[data-rq]").forEach(b=>b.onclick=()=>{
    const p=fps.find(x=>x.id===b.dataset.rq),m=document.querySelector('.rm[data-id="'+p.id+'"]').value.trim(),e=document.querySelector('.rerr[data-id="'+p.id+'"]');
    if(m.length<5){e.textContent="Write a short reason (at least 5 characters).";return}
    if(!isOpen(p)||p.requests.some(r=>r.student===user.email))return;
    if(usedReq()>=REQ_MAX){e.textContent="You have used both requests for this year.";return}
    p.requests.push({id:"r"+Date.now(),student:user.email,msg:m,at:Date.now(),status:"Pending"});note(p.owner,nm(user.email)+' asked to join "'+p.title+'".');saveF();render();
  });
  document.querySelectorAll("[data-dc]").forEach(b=>b.onclick=()=>{
    const p=fps.find(x=>x.id===b.dataset.p),r=p.requests.find(x=>x.id===b.dataset.r),dec=b.dataset.d;
    if(dec==="Accepted"&&left(p)<1)return;
    r.status=dec;note(r.student,'Your request to join "'+p.title+'" was '+dec.toLowerCase()+".");fmsg="Demo only: with the AWS backend, an email about this decision goes to "+r.student+" through Amazon SES.";saveF();render();
  });
  document.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{const p=fps.find(x=>x.id===b.dataset.pc);p.status=p.status==="Open"?"Closed":"Open";saveF();render()});
  document.querySelectorAll("[data-sl]").forEach(b=>b.onclick=()=>{
    const p=fps.find(x=>x.id===b.dataset.sl),f=c=>document.querySelector("."+c+'[data-id="'+p.id+'"]'),g=f("fgh").value.trim(),m=f("fdm").value.trim(),e=f("ferr");
    if(!g&&!m){e.textContent="Add a GitHub link, a demo link, or both.";return}
    if(g&&!/^https:\/\/github\.com\/[\w.-]+\/[\w.-]+/i.test(g)){e.textContent="The GitHub link must look like https://github.com/name/repo";return}
    if(m&&!/^https:\/\/\S+$/i.test(m)){e.textContent="The demo link must start with https://";return}
    p.gh=g;p.demo=m;p.pub=f("flp").checked;saveF();render();
  });
  document.querySelectorAll("[data-cls]").forEach(b=>b.onclick=()=>{user.cls=b.dataset.cls;saveU();render()});
  const fc=document.getElementById("fc");if(fc)fc.onchange=()=>{fcls=fc.value;render()};
  const apost=document.getElementById("apost");
  if(apost)apost.onclick=()=>{
    const v=id=>document.getElementById(id).value.trim(),e=document.getElementById("aserr"),cl=[...document.querySelectorAll(".acls:checked")].map(x=>x.value);
    if(v("at").length<3||v("ad").length<20){e.textContent="Add a title and a description of at least 20 characters.";return}
    if(!cl.length){e.textContent="Choose at least one class.";return}
    if(!v("ao")||!v("ac")||v("ac")<v("ao")||v("ac")<today()){e.textContent="Set an opening date and a closing date that is not in the past and not before the opening date.";return}
    asgs.push({id:"a"+Date.now(),title:v("at").slice(0,120),classes:cl,desc:v("ad").slice(0,1000),opens:v("ao"),closes:v("ac"),teamMax:+v("atm"),timeline:v("atl").slice(0,600),formats:v("af").slice(0,600),closed:false,owner:user.email});saveA();render();
  };
  document.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{const a=asgs.find(x=>x.id===b.dataset.ac);a.closed=!a.closed;saveA();render()});
  document.querySelectorAll("[data-wd]").forEach(b=>b.onclick=()=>{const p=fps.find(x=>x.id===b.dataset.wd),r=p.requests.find(x=>x.student===user.email&&x.status==="Pending");if(!r)return;r.status="Withdrawn";note(p.owner,nm(user.email)+' withdrew the request for "'+p.title+'".');saveF();render()});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const [pi,ri]=b.dataset.rm.split("|"),p=fps.find(x=>x.id===pi),r=p&&p.requests.find(x=>x.id===ri);if(!r||r.status!=="Accepted")return;r.status="Removed";note(r.student,'You were removed from "'+p.title+'".');fmsg="Demo only: with the AWS backend, an email about this change goes to "+r.student+" through Amazon SES.";saveF();render()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;if(delArm!==id){delArm=id;render();return}const d=ideas.find(x=>x.id===id);if(!d||d.owner!==user.email||d.status==="Approved")return;ideas=ideas.filter(x=>x.id!==id);save();delArm="";sel=null;if(last&&last.id===id)last=null;page="ideas";render()});
  const ls=document.getElementById("ls");if(ls)ls.onchange=()=>{lsdg=ls.value;render()};
  const sv=document.getElementById("sv");
  if(sv)sv.onclick=()=>{
    const d=ideas.find(x=>x.id===sel),g=document.getElementById("gh").value.trim(),m=document.getElementById("dm").value.trim(),e=document.getElementById("lerr");
    if(!g&&!m){e.textContent="Add a GitHub link, a demo link, or both.";return}
    if(g&&!/^https:\/\/github\.com\/[\w.-]+\/[\w.-]+/i.test(g)){e.textContent="The GitHub link must look like https://github.com/name/repo";return}
    if(m&&!/^https:\/\/\S+$/i.test(m)){e.textContent="The demo link must start with https://";return}
    d.gh=g;d.demo=m;d.note=document.getElementById("ln").value.trim().slice(0,500);d.pub=document.getElementById("lp").checked;save();render();
  };
  const se=document.getElementById("q");
  if(se){se.value=q;se.oninput=()=>{q=se.value;const pos=se.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)}}
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const d=ideas.find(x=>x.id===sel),v=document.getElementById("ov").value.trim(),e=document.getElementById("oerr");
    if(v!==""&&!(+v>=0&&+v<=100)){e.textContent="Enter a number from 0 to 100, or leave it empty.";return}
    const o0=d.ovr;if(v==="")delete d.ovr;else d.ovr=+v;
    Object.assign(d,score(d,ideas.filter(x=>x.id!==d.id)));
    d.feedback=document.getElementById("fb").value.slice(0,1000);
    const was=d.status;d.status=b.dataset.a;
    d.log=d.log||[];const lg=t=>d.log.push({at:Date.now(),by:user.email,text:t});
    if(d.status!==was){lg("Status: "+was+" to "+d.status);if(d.status==="Approved"||d.status==="Rejected")note([d.owner,...(d.team||[])],'Your idea "'+d.title+'" was '+d.status.toLowerCase()+".")}
    if(o0!==d.ovr)lg(d.ovr==null?"Innovation override removed":"Innovation score set to "+d.ovr+" (automatic score "+Math.round(autoInn(d))+")");
    if(d.status!==was)d.mailNote=((d.status==="Approved"||d.status==="Rejected")&&d.owner!=="seed")?"Demo only: with the AWS backend, an email about this decision goes to "+[d.owner,...(d.team||[])].join(", ")+" through Amazon SES.":"";
    save();render();
  });
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-ai]");if(!b||!sample)return;
  const d=ideas.find(x=>x.id===b.dataset.ai);b.disabled=true;b.textContent="Reviewing...";
  const others=ideas.filter(x=>x.id!==d.id).slice(0,10).map(x=>x.title+": "+x.desc).join("\n")||"none";
  try{
    d.ai=await sample.json(`You review student cloud computing project ideas. Return only JSON with keys: innovation (number 0 to 10), summary (one sentence), risks (up to 3 short strings), suggestions (up to 3 short strings), tech (up to 4 AWS or web technologies), closest (title of the most similar existing idea, or empty string), closestWhy (one short sentence, or empty string).\nIdea: ${d.title}\nDescription: ${d.desc}\nTarget users: ${d.users||"not given"}\nTechnology complexity 1 to 3: ${d.complexity}. Budget Rs ${d.budget}. Weeks ${d.weeks}. Planned technologies: ${d.stack||"not given"}.\nExisting ideas:\n${others}`);
    d.aiErr="";save();
  }catch(err){d.aiErr="AI review unavailable. Try again later."}
  render();
});
window.addEventListener("cloud-state-updated",()=>{
  try { ideas=JSON.parse(localStorage.getItem("ideas4")||"[]"); asgs=JSON.parse(localStorage.getItem("asg1")||"[]"); fps=JSON.parse(localStorage.getItem("fp1")||"[]"); notes=JSON.parse(localStorage.getItem("notes1")||"[]"); wlog=JSON.parse(localStorage.getItem("wlog1")||"[]"); const nw=JSON.parse(localStorage.getItem("weights1")||"null"); if(nw&&Object.keys(DEF).every(k=>Number.isInteger(nw[k]))&&Object.values(nw).reduce((a,b)=>a+b,0)===100)Object.assign(W,nw); render(); } catch(e){ console.warn("Could not refresh cloud data:",e.message); }
});
(async()=>{
  try { await window.cognitoAuthReady; await handleCognitoCallback(); if(window.AppCloud && window.AppCloud.enabled() && !sessionStorage.getItem("cognito_id_token")){try{await window.refreshCognitoSession()}catch(_){}} user=restoreCognitoUser(); if(user && !user.localDemo && window.AppCloud)await window.AppCloud.activate(user); }
  catch(e) { user=null; const u=new URL(location.href); u.searchParams.set("auth_error",e.message||"Authentication failed."); history.replaceState({},document.title,u.pathname+u.search); }
  render();
  try{window.claude&&window.claude.use("sample").then(x=>{if(x){sample=x;render()}})}catch(e){}
})();
